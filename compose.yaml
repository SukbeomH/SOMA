name: soma-local
services:
  soma:
    build: .
    init: true
    ports:
      - "127.0.0.1:${SOMA_WEB_PORT:-8765}:${SOMA_WEB_PORT:-8765}"
    environment:
      SOMA_WEB_PORT: ${SOMA_WEB_PORT:-8765}
    volumes:
      - soma-data:/data
      - soma-codex:/home/soma/.codex
    restart: "no"
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.SOMA_WEB_PORT+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  soma-data:
  soma-codex:
